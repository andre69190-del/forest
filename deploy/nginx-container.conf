# BIOGLOW Forest — nginx-Config IM Container (Muster: Polski Szlak / GeoQuest).
# Nur Port 80, kein TLS — HTTPS macht der Coolify-Proxy (Traefik).
# Anders als GeoQuest: Kamera, Standort und Mikrofon sind für die eigene Seite ERLAUBT (Kernfunktionen).
map $uri $forest_cache {
    default                  "public, max-age=3600";
    ~*^/assets/              "public, max-age=31536000, immutable";
    ~*/sw\.js$               "no-cache, no-store, must-revalidate";
    ~*/registerSW\.js$       "no-cache";
    ~*/workbox-.*\.js$       "public, max-age=31536000, immutable";
    ~*\.webmanifest$         "no-cache";
    ~*\.html$                "no-cache";
    "/"                      "no-cache";
}
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options    "nosniff"                                                       always;
    add_header X-Frame-Options           "DENY"                                                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"                               always;
    add_header Permissions-Policy        "camera=(self), microphone=(self), geolocation=(self), payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains"                           always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' blob: data: https://tile.openstreetmap.org; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control             $forest_cache                                                   always;

    gzip on; gzip_comp_level 6; gzip_min_length 1024; gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json application/geo+json;

    # Die App nutzt Hash-Routing (#/…) → nur "/" liefert die App. Unbekannte Pfade bekommen einen
    # echten 404, damit Google keine Schein-Seiten indexiert (Lehre aus GeoQuest/Polski Szlak).
    types { application/manifest+json webmanifest; }
    index index.html;
    location = / { try_files /index.html =404; }
    location / { try_files $uri =404; }
}
