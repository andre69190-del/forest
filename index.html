        <h1>BIOGLOW Forest – Prüfbare Feldnachweise für zertifizierte Wälder</h1>
        <p>BIOGLOW Forest ist eine kostenlose Web-App für Waldbesitzer, Prüfer und Fachleute: Flächengrenzen ablaufen und als EUDR-GeoJSON exportieren, Habitatbäume mit Mikrohabitaten erfassen, Totholz messen und Feldbesuche dokumentieren. Jeder Eintrag wird auf dem Gerät signiert – jede spätere Änderung fällt auf. Die App funktioniert offline. Bitte JavaScript aktivieren.</p>
